name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check repository independence
        run: |
          node scripts/check-independence.mjs
          node scripts/check-module-boundaries.mjs
          node scripts/check-source-provenance.mjs
      # Realtime parity (A-100). The platform repository is private and is not
      # cloned here, so this validates the committed snapshot: it still catches
      # a registry that drops an event or keeps a dead listener. The snapshot
      # itself is refreshed against a real platform checkout locally, which is
      # what detects newly added server events.
      - name: Check realtime parity
        run: |
          node scripts/check-realtime-parity.mjs
          node scripts/check-endpoint-parity.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate, test, lint, and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
