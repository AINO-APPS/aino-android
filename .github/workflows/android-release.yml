name: Android Release

# Builds a production-signed APK and AAB and publishes them to the Cloudflare R2
# `android/` prefix plus a GitHub release.
#
# Triggered by `android-v*` tags so it can never collide with the platform's
# `v*` (desktop) tags or the retired Expo `mobile-v*` tags.
#
# CHANNEL ISOLATION: this workflow only ever writes under `android/`. The legacy
# Expo channel at `mobile/` is retired and must not be touched — see
# DECISIONS.md #13.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag against app/build.gradle.kts
        id: check
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/android-v}"
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)

          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match versionName ($GRADLE_VERSION)"
            exit 1
          fi

          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be numeric X.Y.Z: $TAG_VERSION"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          for part in "$MAJOR" "$MINOR" "$PATCH"; do
            if [ "$part" -gt 999 ]; then
              echo "::error::Each version component must be 0..999: $TAG_VERSION"
              exit 1
            fi
          done

          # Android compares this integer, not versionName, when replacing an APK.
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))

          GRADLE_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if [ "$VERSION_CODE" != "$GRADLE_CODE" ]; then
            echo "::error::versionCode ($GRADLE_CODE) must be $VERSION_CODE for $TAG_VERSION"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG_VERSION (versionCode $VERSION_CODE)"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      # Written before the build because the Firebase Gradle plugin resolves it at
      # configuration time. Never committed: it carries the FCM sender config.
      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON}" ]; then
            echo "::notice::ANDROID_GOOGLE_SERVICES_JSON is empty; building without Firebase configuration"
            exit 0
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json;json.load(open('app/google-services.json'))"
          echo "google-services.json written and valid"

      # Decoded OUTSIDE the working tree so it can never be caught by a glob,
      # cached, or uploaded as a build artifact.
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty - cannot produce a release-signed build"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/aino-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::decoded keystore is empty - check the base64 secret"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null
          echo "path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Stage artifacts with versioned names
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK" || { echo "::error::Missing $APK"; find app/build/outputs -name '*.apk' || true; exit 1; }
          test -f "$AAB" || { echo "::error::Missing $AAB"; find app/build/outputs -name '*.aab' || true; exit 1; }
          cp "$APK" "release-assets/AINO-${VERSION}.apk"
          cp "$AAB" "release-assets/AINO-${VERSION}.aab"
          ls -la release-assets/

      # Guard against silently shipping a DEBUG-signed artifact: if the signing
      # config fails to apply, Gradle falls back to the debug keystore.
      - name: Verify release signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "release-assets/AINO-${VERSION}.apk" | tee /tmp/certs.txt
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK is DEBUG-signed - the release signing config did not apply"
            exit 1
          fi
          if ! grep -qi 'CN=AINO' /tmp/certs.txt; then
            echo "::error::APK is not signed by the expected AINO release key"
            exit 1
          fi
          echo "Release signature verified"

      - name: Verify APK identity and version metadata
        env:
          EXPECTED_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "release-assets/AINO-${VERSION}.apk" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='app.aino.mobile'"
          echo "$BADGING" | grep -q "versionName='${VERSION}'"
          echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'"
          echo "APK identity verified"

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          echo "## Checksums (SHA-256)" > checksums.txt
          sha256sum *.apk *.aab >> checksums.txt
          cat checksums.txt

      - name: Upload APK (immutable, long cache)
        run: |
          set -euo pipefail
          TAG="android-v${VERSION}"
          aws s3 cp "release-assets/AINO-${VERSION}.apk" \
            "s3://${R2_BUCKET}/android/releases/${TAG}/AINO-${VERSION}.apk" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Build and upload the update manifest
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep '^android-v' | sed -n '2p' || true)
          NOTES=""
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}"..HEAD --pretty=format:'- %s' --no-merges | head -30 || true)
          fi
          jq -n \
            --arg version    "$VERSION" \
            --arg apkUrl     "${R2_PUBLIC_BASE_URL}/android/releases/android-v${VERSION}/AINO-${VERSION}.apk" \
            --arg notes      "$NOTES" \
            --arg releaseUrl "${R2_PUBLIC_BASE_URL}/android/releases/android-v${VERSION}/" \
            '{version:$version, apkUrl:$apkUrl, notes:$notes, releaseUrl:$releaseUrl}' \
            > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://${R2_BUCKET}/android/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify the published channel
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            actual=$(curl --fail --silent --show-error "${R2_PUBLIC_BASE_URL}/android/latest.json?t=$(date +%s)" || true)
            if [ "$(echo "$actual" | jq -r .version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "android/latest.json serves $VERSION"
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::android/latest.json did not converge on $VERSION"
              exit 1
            fi
            sleep 5
          done
          code=$(curl -o /dev/null -s -w '%{http_code}' -I \
            "${R2_PUBLIC_BASE_URL}/android/releases/android-v${VERSION}/AINO-${VERSION}.apk")
          if [ "$code" != "200" ]; then
            echo "::error::Published APK is not reachable (HTTP $code)"
            exit 1
          fi
          echo "APK reachable"

      - name: Prune old releases (keep newest 5)
        run: |
          set -euo pipefail
          all=$(aws s3 ls "s3://${R2_BUCKET}/android/releases/" --endpoint-url "$R2_ENDPOINT" \
                | awk '{print $2}' | sed 's#/##' | grep -E '^android-v[0-9]' || true)
          [ -z "$all" ] && { echo "Nothing to prune"; exit 0; }
          sorted=$(echo "$all" | sed 's/^android-v//' | sort -V)
          total=$(echo "$sorted" | grep -c . || true)
          if [ "${total:-0}" -gt 5 ]; then
            for r in $(echo "$sorted" | head -n $((total - 5))); do
              echo "Pruning android/releases/android-v${r}"
              aws s3 rm "s3://${R2_BUCKET}/android/releases/android-v${r}/" --recursive --endpoint-url "$R2_ENDPOINT"
            done
          else
            echo "Only ${total:-0} releases; keeping all"
          fi

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep '^android-v' | sed -n '2p' || true)
          {
            echo "## AINO Android v${VERSION}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
              echo
              git log "${PREV_TAG}"..HEAD --pretty=format:'- %s' --no-merges | head -30
              echo
            fi
            echo
            echo "### Install"
            echo
            echo "Download \`AINO-${VERSION}.apk\` and install it on an Android 8.0+ device."
            echo "You may need to allow installs from unknown sources."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat release-assets/checksums.txt
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          if gh release view "android-v${VERSION}" >/dev/null 2>&1; then
            gh release upload "android-v${VERSION}" \
              "release-assets/AINO-${VERSION}.apk" \
              "release-assets/AINO-${VERSION}.aab" \
              release-assets/checksums.txt \
              --clobber
            gh release edit "android-v${VERSION}" \
              --title "AINO Android v${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "android-v${VERSION}" \
              "release-assets/AINO-${VERSION}.apk" \
              "release-assets/AINO-${VERSION}.aab" \
              release-assets/checksums.txt \
              --title "AINO Android v${VERSION}" \
              --notes-file release-notes.md
          fi
