org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# NOTE ON CORPORATE TLS INTERCEPTION
#
# Some networks terminate TLS with a private root CA that Windows trusts but the
# JDK's bundled `cacerts` does not, which fails every download with
# "PKIX path building failed". The fix is:
#
#   systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
#
# It must NOT live in this file. `gradle.properties` is also read by the wrapper
# before the JVM starts, and `Windows-ROOT` does not exist on Linux or macOS, so
# committing it breaks CI with "problem accessing trust store" before Gradle is
# even downloaded.
#
# Put it in your per-user file instead, which is never committed:
#   %USERPROFILE%\.gradle\gradle.properties
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
