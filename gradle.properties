org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Some corporate networks terminate TLS with a private root CA that is present in
# the Windows certificate store but absent from the JDK's bundled `cacerts`. That
# makes Gradle's own distribution download and every dependency fetch fail with
# "PKIX path building failed". Delegating to the OS trust store fixes those hosts
# without weakening verification (certificates are still validated) and without
# checking a private CA into the repository.
#
# This is inert on Linux/macOS CI: the Windows-ROOT store type only exists on
# Windows, so GitHub Actions runners keep using the default JDK truststore.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
